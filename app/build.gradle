plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.20'
    id 'com.google.protobuf'
//    id 'com.google.protobuf' version '0.9.4' apply false
    alias(libs.plugins.compose.compiler)
    id 'com.google.devtools.ksp' version '2.3.4'
    id("com.google.dagger.hilt.android")
}

def versionsPropertiesFile = rootProject.file("version.properties")
def versionProperties = new Properties()
versionProperties.load(new FileInputStream(versionsPropertiesFile))

android {
    namespace 'com.example.sw0b_001'
    compileSdk 36

    def _versionName = versionProperties['versionName']
    def tagVersion = Integer.parseInt(versionProperties['tagVersion'])

    defaultConfig {
        applicationId "com.afkanerd.sw0b"
        minSdk 24
        targetSdk 36
        versionCode tagVersion
        versionName _versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }
        resourceConfigurations += ['en', 'fr', 'fa', 'es', 'tr', 'ar', 'de', 'sw', 'zh', 'ko', 'hi', 'sn']

        manifestPlaceholders = ['appAuthRedirectScheme': 'oauth.afkanerd.com']

        Properties properties = new Properties()
        if (rootProject.file("local.properties").exists()) {
            properties.load(rootProject.file("local.properties").newDataInputStream())
        }
        buildConfigField "String", "RECAPTCHA_KEY", properties.getProperty("recaptcha_key", "\"\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("Boolean", "IS_RECAPTCHA", "false")
            buildConfigField("Boolean", "IS_ONBOARDING", "false")
            buildConfigField("Boolean", "IS_SHOWALL_ONBOARDING", "false")
        }
        debug {
            buildConfigField("Boolean", "IS_RECAPTCHA", "false")
            buildConfigField("Boolean", "IS_ONBOARDING", "false")
            // Does not skip the onboarding screens
            buildConfigField("Boolean", "IS_SHOWALL_ONBOARDING", "true")
        }
    }

    buildscript {
        ext {
            compose_compiler = '1.3.1'         //compiler
            compose_version = '1.3.0-beta02'   //compose dependencies
            compose_material3 = '1.0.0-beta02' //material3 release
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    sourceSets {
        main {
            java.srcDirs += [
                    'build/generated/java/generateDebugProto/java',
                    'build/generated/java/generateDebugProto/grpc',
            ]
        }
    }

    packagingOptions {
        pickFirst 'META-INF/androidx.localbroadcastmanager_localbroadcastmanager.version'
    }
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.29.3' }
    plugins {
        grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.71.0' }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins { java { option 'lite' } }
            task.plugins { grpc { option 'lite' } }
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        // Fix Protobuf/gRPC stalemate
        // We use 4.29.3 to match your protoc version defined in the protobuf block
        force 'com.google.protobuf:protobuf-javalite:4.29.3'
        force 'com.google.protobuf:protobuf-kotlin-lite:4.29.3'

        dependencySubstitution {
            substitute module('com.google.protobuf:protobuf-java') using module('com.google.protobuf:protobuf-javalite:4.29.3')
        }
    }
}

