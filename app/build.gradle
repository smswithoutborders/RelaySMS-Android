plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
    id 'com.google.protobuf'
    alias(libs.plugins.compose.compiler)
    id 'com.google.devtools.ksp' version '2.3.9'
    id("com.google.dagger.hilt.android")
}

ext {
    abiCodes = ['armeabi-v7a': 1, 'x86_64': 2, 'arm64-v8a': 3]
}

android {
    namespace 'com.example.sw0b_001'
    compileSdk 36

    def versionsPropertiesFile = rootProject.file("version.properties")
    def versionProperties = new Properties()
    versionProperties.load(new FileInputStream(versionsPropertiesFile))

    def signingPropertiesFile = rootProject.file("keystore.properties")
    def signingProperties = new Properties()
    if(signingPropertiesFile.exists())
        signingProperties.load(new FileInputStream(signingPropertiesFile))

    def _versionName = versionProperties['versionName']
    def tagVersion = Integer.parseInt(versionProperties['tagVersion'])

    signingConfigs {
        release {
            if (signingProperties) {
                storeFile = file(signingProperties['storeFile'])
                storePassword = signingProperties['storePassword']
                keyAlias = signingProperties['keyAlias']
                keyPassword = signingProperties['keyPassword']
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk false
        }
    }

    defaultConfig {
        applicationId "com.afkanerd.sw0b"
        minSdk 24
        targetSdk 36
        versionCode tagVersion
        versionName _versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }
        resourceConfigurations += ['en', 'fr', 'fa', 'es', 'tr', 'ar', 'de', 'sw', 'zh', 'ko', 'hi', 'sn']

        manifestPlaceholders = ['appAuthRedirectScheme': 'oauth.afkanerd.com']

        Properties properties = new Properties()
        if (rootProject.file("local.properties").exists()) {
            properties.load(rootProject.file("local.properties").newDataInputStream())
        }
        buildConfigField "String", "RECAPTCHA_KEY", properties.getProperty("recaptcha_key", "\"\"")
    }

    buildTypes {
        profiling {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
//            minifyEnabled true
//            shrinkResources true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            testProguardFiles 'proguard-rules.pro'
        }
    }

    buildscript {
        ext {
            compose_compiler = '1.3.1'         //compiler
            compose_version = '1.3.0-beta02'   //compose dependencies
            compose_material3 = '1.0.0-beta02' //material3 release
        }
    }

//    composeCompiler {
//        includeComposeMappingFile.set(false)
//    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packagingOptions {
        pickFirst 'META-INF/androidx.localbroadcastmanager_localbroadcastmanager.version'
        resources.excludes.add("META-INF/proguard/okhttp3.pro")
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = false
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            // Look up the ABI name from the variant filters
            def abiFilter = output.filters.find { it.filterType.name() == "ABI" }?.identifier
            def baseAbiVersionCode = project.ext.abiCodes.get(abiFilter)

            if (baseAbiVersionCode != null) {
                // In AGP 9.x, versionCode is a Property wrapper, so we must use .set()
                output.versionCode.set((100 * android.defaultConfig.versionCode) + baseAbiVersionCode)
            } else {
                output.versionCode.set(100 * android.defaultConfig.versionCode)
            }
        }
    }
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.29.3' }
    plugins {
        grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.71.0' }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { option 'lite' }
                kotlin { option 'lite' }
            }
            task.plugins { grpc { option 'lite' } }
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0'
        force 'com.google.protobuf:protobuf-javalite:4.29.3'
        force 'com.google.protobuf:protobuf-kotlin-lite:4.29.3'

        force 'androidx.test.ext:junit:1.3.0'
        force 'androidx.test.espresso:espresso-core:3.7.0'
        force 'androidx.test:runner:1.6.0'
        force 'androidx.test:rules:1.6.0'
    }
}


