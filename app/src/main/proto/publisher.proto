syntax = "proto3";

package publisher.v3;

// Represents a public key
message PublicKey {
  // The key ID
  uint32 key_id = 1;
  // The public key (32 bytes)
  bytes public_key = 2;
}

// Request message for getting the OAuth2 authorization URL
//
// Required headers:
//   X-Payload-bin:    Encrypted request payload ciphertext (binary)
//   X-Public-Key-bin: Client ephemeral public key (eC_pk, 32 bytes, binary)
//   X-Key-ID:         Server identity key ID used for encrypting the payload (string)
//   X-Nonce-bin:      Request nonce (16 bytes, binary)
//   X-Timestamp:      Unix timestamp in seconds (string)
message GetOAuth2AuthorizationUrlRequest {
  // The platform for which the authorization URL is requested
  string platform = 1;
  // Optional state parameter to prevent CSRF attacks
  string state = 2;
  // Optional PKCE code verifier. Ignored if autogenerate_code_verifier is true.
  string code_verifier = 3;
  // If true, a PKCE code verifier is auto-generated and code_verifier is ignored
  bool autogenerate_code_verifier = 4;
  // Optional redirect URL for the OAuth2 application
  string redirect_url = 5;
  // Optional request identifier for tracking
  string request_identifier = 6;
}

// Response message for GetOAuth2AuthorizationUrl
message GetOAuth2AuthorizationUrlResponse {
  // The authorization URL to redirect the user to
  string authorization_url = 1;
  // State parameter for CSRF protection
  string state = 2;
  // PKCE code verifier (auto-generated or echo of the request value)
  string code_verifier = 3;
  // A response message
  string message = 4;
  // Scope of the authorization request
  string scope = 5;
  // Client ID of the OAuth2 application
  string client_id = 6;
  // Redirect URL of the OAuth2 application
  string redirect_url = 7;
}

// Request message for exchanging an OAuth2 authorization code for a token
//
// Required headers:
//   X-Payload-bin:    Encrypted request payload ciphertext (binary)
//   X-Public-Key-bin: Client ephemeral public key (eC_pk, 32 bytes, binary)
//   X-Key-ID:         Server identity key ID used for encrypting the payload (string)
//   X-Nonce-bin:      Request nonce (16 bytes, binary)
//   X-Timestamp:      Unix timestamp in seconds (string)
message ExchangeOAuth2CodeAndStoreRequest {
  // The platform for which the token exchange is being performed
  string platform = 1;
  // The authorization code received from the authorization server
  string authorization_code = 2;
  // Optional PKCE code verifier
  string code_verifier = 3;
  // Optional redirect URL for the OAuth2 application
  string redirect_url = 4;
  // Optional request identifier for tracking
  string request_identifier = 5;
  // Client ephemeral public keys to associate with the stored token
  repeated PublicKey client_ephemeral_public_keys = 6;
}

// Response message for ExchangeOAuth2CodeAndStore
message ExchangeOAuth2CodeAndStoreResponse {
  // Indicates if the token exchange and storage was successful
  bool success = 1;
  // A response message
  string message = 2;
  // Account identifier associated with the token
  string account_identifier = 3;
  // Encrypted token ciphertext
  bytes token_ciphertext = 4;
  // Unique identifier of the stored token
  uint32 token_id = 5;
  // Server ephemeral public keys associated with the token
  repeated PublicKey server_ephemeral_public_keys = 6;
  // Key ID used for encrypting the token ciphertext
  uint32 key_id = 7;
  // The platform name
  string platform = 8;
  // Category identifier
  uint32 cat_id = 9;
}

// Request message for revoking an OAuth2 token
//
// Required headers:
//   X-Payload-bin:    Encrypted request payload ciphertext (binary)
//   X-Public-Key-bin: Client ephemeral public key (eC_pk, 32 bytes, binary)
//   X-Key-ID:         Server identity key ID used for encrypting the payload (string)
//   X-Nonce-bin:      Request nonce (16 bytes, binary)
//   X-Timestamp:      Unix timestamp in seconds (string)
message RevokeOAuth2TokenRequest {
  // The unique identifier of the stored token
  uint32 token_id = 1;
  // The key ID used for encrypting the token in the payload
  uint32 key_id = 2;
}

// Response message for RevokeOAuth2Token
message RevokeOAuth2TokenResponse {
  // Indicates if the token revocation and deletion was successful
  bool success = 1;
  // A response message
  string message = 2;
}

// Request message for getting the PNBA code
//
// Required headers:
//   X-Payload-bin:    Encrypted request payload ciphertext (binary)
//   X-Public-Key-bin: Client ephemeral public key (eC_pk, 32 bytes, binary)
//   X-Key-ID:         Server identity key ID used for encrypting the payload (string)
//   X-Nonce-bin:      Request nonce (16 bytes, binary)
//   X-Timestamp:      Unix timestamp in seconds (string)
message GetPNBACodeRequest {
  // The platform for which the PNBA code is requested
  string platform = 1;
  // The phone number for the platform
  string phone_number = 2;
  // Optional request identifier for tracking the request
  string request_identifier = 3;
  // The medium used to deliver the code (e.g., "whatsapp", "telegram", "signal").
  string channel = 4;
}

// Response message for getting the PNBA code
message GetPNBACodeResponse {
  // Indicates if the request was successful
  bool success = 1;
  // A response message
  string message = 2;
}

// Request message for exchanging the PNBA code for a token and storing it
//
// Required headers:
//   X-Payload-bin:    Encrypted request payload ciphertext (binary)
//   X-Public-Key-bin: Client ephemeral public key (eC_pk, 32 bytes, binary)
//   X-Key-ID:         Server identity key ID used for encrypting the payload (string)
//   X-Nonce-bin:      Request nonce (16 bytes, binary)
//   X-Timestamp:      Unix timestamp in seconds (string)
message ExchangePNBACodeAndStoreRequest {
  // The platform for which the token exchange is being performed
  string platform = 1;
  // The phone number for the platform
  string phone_number = 2;
  // The authorization code received from the platform
  string authorization_code = 3;
  // The password for two-step verification
  string password = 4;
  // Optional request identifier for tracking the request
  string request_identifier = 5;
  // Client ephemeral public keys to associate with the stored token
  repeated PublicKey client_ephemeral_public_keys = 6;
  // The medium used to receive the code (e.g., "whatsapp", "telegram", "signal").
  string channel = 7;
}

// Response message for exchanging the PNBA code for a token and storing it
message ExchangePNBACodeAndStoreResponse {
  // Indicates if the request was successful
  bool success = 1;
  // A response message
  string message = 2;
  // Indicates if two step verification is enabled
  bool two_step_verification_enabled = 3;
  // Account identifier associated with the token
  string account_identifier = 4;
  // Encrypted token ciphertext
  bytes token_ciphertext = 5;
  // Unique identifier of the stored token
  uint32 token_id = 6;
  // Server ephemeral public keys associated with the token
  repeated PublicKey server_ephemeral_public_keys = 7;
  // Key ID used for encrypting the token ciphertext
  uint32 key_id = 8;
  // The platform name
  string platform = 9;
  // Category identifier
  uint32 cat_id = 10;
}

// Request message for revoking and deleting a PNBA token
//
// Required headers:
//   X-Payload-bin:    Encrypted request payload ciphertext (binary)
//   X-Public-Key-bin: Client ephemeral public key (eC_pk, 32 bytes, binary)
//   X-Key-ID:         Server identity key ID used for encrypting the payload (string)
//   X-Nonce-bin:      Request nonce (16 bytes, binary)
//   X-Timestamp:      Unix timestamp in seconds (string)
message RevokePNBATokenRequest {
  // The unique identifier of the stored token
  uint32 token_id = 1;
  // The key ID used for encrypting the token in the payload
  uint32 key_id = 2;
}

// Response message for revoking and deleting a PNBA token
message RevokePNBATokenResponse {
  // A response message.
  string message = 1;
  // Indicates whether the operation was successful.
  bool success = 2;
}

// Request message for syncing key pools for a token
//
// Required headers:
//   X-Payload-bin:    Encrypted request payload ciphertext (binary)
//   X-Public-Key-bin: Client ephemeral public key (eC_pk, 32 bytes, binary)
//   X-Key-ID:         Server identity key ID used for encrypting the payload (string)
//   X-Nonce-bin:      Request nonce (16 bytes, binary)
//   X-Timestamp:      Unix timestamp in seconds (string)
message SyncKeysRequest {
  // The unique identifier of the stored token
  uint32 token_id = 1;
  // The key ID used for encrypting the token in the payload
  uint32 key_id = 2;
  // Client ephemeral public keys to associate with the stored token
  repeated PublicKey client_ephemeral_public_keys = 3;
}

// Response message for SyncKeys
message SyncKeysResponse {
  // Indicates if the sync was successful
  bool success = 1;
  // A response message
  string message = 2;
  // Server ephemeral public keys associated with the token
  repeated PublicKey server_ephemeral_public_keys = 3;
}

// Publisher service
service Publisher {
  // RPC for getting the OAuth2 authorization URL
  rpc GetOAuth2AuthorizationUrl(GetOAuth2AuthorizationUrlRequest) returns (GetOAuth2AuthorizationUrlResponse);
  // RPC for exchanging OAuth2 authorization code for a token
  rpc ExchangeOAuth2CodeAndStore(ExchangeOAuth2CodeAndStoreRequest) returns (ExchangeOAuth2CodeAndStoreResponse);
  // RPC for revoking and deleting an OAuth2 token
  rpc RevokeOAuth2Token(RevokeOAuth2TokenRequest) returns (RevokeOAuth2TokenResponse);
  // RPC for getting the PNBA code
  rpc GetPNBACode(GetPNBACodeRequest) returns (GetPNBACodeResponse);
  // RPC for exchanging the PNBA code for a token and storing it
  rpc ExchangePNBACodeAndStore(ExchangePNBACodeAndStoreRequest) returns (ExchangePNBACodeAndStoreResponse);
  // RPC for revoking and deleting a PNBA token
  rpc RevokePNBAToken(RevokePNBATokenRequest) returns (RevokePNBATokenResponse);
  // RPC for syncing client and server ephemeral key pools for a token
  rpc SyncKeys(SyncKeysRequest) returns (SyncKeysResponse);
}
